[package]
name = "librecar-core"
version = "1.1.0"
edition = "2021"
authors = ["PolskieWin", "LibreCar Contributors"]
description = "Open-source Rust driving meter, eco-route fuel optimizer, bilingual EN/PL voice parser, and 60fps Flappy Bird engine for Android 14+"
license = "MIT"

[lib]
name = "librecar_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
