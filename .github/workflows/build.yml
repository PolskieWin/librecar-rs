name: Build & Test LibreCar RS (Android 14+ & Rust)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  rust-tests:
    name: Rust Core Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust Tests
        working-directory: rust-core
        run: cargo test --verbose

  build-apk:
    name: Build Rust NDK & Release APKs
    needs: rust-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK & SDK Platform
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Set up Rust Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Native Core (.so with 16KB page alignment)
        working-directory: rust-core
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
          ls -lh ../app/src/main/jniLibs/*/liblibrecar_core.so

      - name: Upload Native jniLibs for E2E Job
        uses: actions/upload-artifact@v4
        with:
          name: librecar-jnilibs
          path: app/src/main/jniLibs

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APKs (R8 Shrunk + Split ABIs)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            cp "$f" "release-apks/LibreCar-RS-${base}"
          done
          ls -lh release-apks

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: librecar-rs-release-apks
          path: release-apks/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "LibreCar RS v1.1.0"
          draft: false
          prerelease: false
          make_latest: true
          files: release-apks/*.apk
          body: |
            # LibreCar RS v1.1.0

            Open-source (MIT) Android 14+ CarPlay dashboard powered by Rust.
            Zero trackers, zero telemetry, zero analytics.

  emulator-e2e:
    name: Android 14 Live Emulator E2E Test & Screen Recording
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Rust jniLibs
        uses: actions/download-artifact@v4
        with:
          name: librecar-jnilibs
          path: app/src/main/jniLibs

      - name: Install Android SDK Platform 37.0
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Enable KVM Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run Live Android 14 Emulator E2E Suite & Speedtest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p e2e-artifacts/shots
            ./gradlew installDebug --no-daemon
            echo "=== COLD START SPEEDTEST (5x am start -W -S) ===" > e2e-artifacts/speedtest.txt
            for i in 1 2 3 4 5; do
              adb shell am start -W -S com.librecar.rust.debug/com.librecar.rust.MainActivity | tee -a e2e-artifacts/speedtest.txt
              sleep 1
            done
            echo "=== WARM START SPEEDTEST ===" >> e2e-artifacts/speedtest.txt
            adb shell input keyevent KEYCODE_HOME
            sleep 1
            adb shell am start -W com.librecar.rust.debug/com.librecar.rust.MainActivity | tee -a e2e-artifacts/speedtest.txt
            adb logcat -c
            adb shell screenrecord --bit-rate 4000000 --time-limit 120 /sdcard/e2e_recording.mp4 &
            REC_PID=$!
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
            TEST_RC=$?
            adb shell pkill -2 screenrecord || true
            sleep 3
            adb pull /sdcard/librecar_shots e2e-artifacts/shots || true
            adb pull /sdcard/e2e_recording.mp4 e2e-artifacts/e2e_recording.mp4 || true
            adb logcat -d > e2e-artifacts/logcat.txt || true
            grep -E "LIBRECAR_BENCH|LIBRECAR_FLAPPY_LIVE" e2e-artifacts/logcat.txt >> e2e-artifacts/speedtest.txt || true
            cat e2e-artifacts/speedtest.txt
            ls -lh e2e-artifacts e2e-artifacts/shots || true
            exit $TEST_RC

      - name: Upload E2E Screenshots, Screen Recording & Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android14-e2e-artifacts
          path: e2e-artifacts
