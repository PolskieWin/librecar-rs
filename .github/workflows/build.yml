name: Build & Test LibreCar RS (Android 14+ & Rust)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  rust-tests:
    name: Rust Core Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust Tests
        working-directory: rust-core
        run: cargo test --verbose

  build-apk:
    name: Build Rust NDK & Release APKs
    needs: rust-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK & SDK Platform
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Set up Rust Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Native Core (.so with 16KB page alignment)
        working-directory: rust-core
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
          ls -lh ../app/src/main/jniLibs/*/liblibrecar_core.so

      - name: Upload Native jniLibs for E2E Job
        uses: actions/upload-artifact@v4
        with:
          name: librecar-jnilibs
          path: app/src/main/jniLibs

      - name: Run JVM & Instrumentation Test Compilation
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin --no-daemon

      - name: Build Release APKs (R8 Shrunk + Split ABIs)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            cp "$f" "release-apks/LibreCar-RS-${base}"
          done
          ls -lh release-apks

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: librecar-rs-release-apks
          path: release-apks/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: "LibreCar RS v1.2.1"
          draft: false
          prerelease: false
          make_latest: true
          files: release-apks/*.apk
          body: |
            # LibreCar RS v1.2.1

            Open-source (MIT) Android 14+ CarPlay dashboard powered by Rust.
            Made by Polskie · Zero remote trackers, zero analytics (local-only vehicle telemetry engine).
            Includes compact auto-hiding driving map HUD with live Map GUI Size slider (`50%–115%`), ultra-slim `Ultra Compact` layout, accurate GNSS-only km counter (fixes startup 2 km jump), Built-in Offline Car AI (+ optional Gemini 2.5 Flash API support), Gemini-style voice presets (`Nova`, `Dipper`, `Lyra`, `Ursa`, `Orbit`), Best Fuel & Best Speed routing, Live Car Radio, Music Looping + Spotify PKCE, Clean YouTube WebView, 120Hz High Refresh Display, 240 TPS Flappy Bird & Geometry Dash.
